<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Projeção Ortogonal - RA Fixa</title>
    
    <!-- Importa as bibliotecas de Realidade Aumentada baseada em Imagem -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Mensagem de carregamento na tela do aluno */
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: sans-serif; background: rgba(0,0,0,0.8); color: white; padding: 15px 25px; border-radius: 10px; z-index: 9999; text-align: center; }
    </style>
</head>
<body>

    <div id="loading">Aponte a câmera para o QR Code da folha...</div>

    <!-- Configura a câmera e aponta para o arquivo do marcador -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta:0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Carrega a sua peça modelada -->
            <a-asset-item id="modeloPeca" src="./peca.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Quando o celular encontrar o QR Code (Target 0), ele renderiza a peça exatamente em cima -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Você pode ajustar a escala (scale) e rotação (rotation) se a peça ficar muito grande ou torta -->
            <a-gltf-model src="#modeloPeca" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 0 0"></a-gltf-model>
        </a-entity>
        
    </scene>

    <script>
        // Esconde a mensagem de carregamento assim que o sistema de RA inicializar
        document.querySelector('a-scene').addEventListener("arReady", (event) => {
            document.getElementById('loading').style.display = 'none';
        });
    </script>
</body>
</html>
